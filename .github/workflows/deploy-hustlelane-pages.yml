name: Deploy HustleLane to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/hustlelane/client/**'
      - '.github/workflows/deploy-hustlelane-pages.yml'

permissions:
  contents: write

concurrency:
  group: hustlelane-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/hustlelane/client/package-lock.json

      - name: Install & build
        working-directory: apps/hustlelane/client
        env:
          VITE_BASE: /DitiroPortfolio/hustlelane/
          VITE_API_URL: ${{ secrets.VITE_HUSTLELANE_API_URL }}
          VITE_SOCKET_URL: ${{ secrets.VITE_HUSTLELANE_SOCKET_URL }}
        run: |
          npm ci
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::Add repo secret VITE_HUSTLELANE_API_URL (e.g. https://hustlelane-api.onrender.com/api)"
            exit 1
          fi
          npm run build
          rm -rf "$GITHUB_WORKSPACE/hustlelane"
          mkdir -p "$GITHUB_WORKSPACE/hustlelane"
          cp -R dist/* "$GITHUB_WORKSPACE/hustlelane/"

      - name: Commit built site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hustlelane
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "deploy: HustleLane GitHub Pages build"
          git push
